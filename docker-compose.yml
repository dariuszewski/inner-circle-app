services:
  db:
    image: postgres:16
    container_name: inner_circle_db
    environment:
      - POSTGRES_USER=ic_user
      - POSTGRES_PASSWORD=ic_password
      - POSTGRES_DB=ic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
  