services:
  db:
    image: postgres:16
    container_name: inner_circle_db
    environment:
      - POSTGRES_USER=ic_user
      - POSTGRES_PASSWORD=ic_password
      - POSTGRES_DB=ic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  storage:
    image: chrislusf/seaweedfs:latest
    container_name: inner_circle_storage
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data
      - ./s3-dev-config.yml:/etc/seaweedfs/s3.json:ro

  backend:
    build:
      context: .
      provenance: false
    container_name: inner_circle_backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_started
      storage:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+asyncpg://ic_user:ic_password@db:5432/ic_db
      - STORAGE_URL=http://storage:8333
      - STORAGE_BUCKET=inner-circle
      - STORAGE_ACCESS_KEY=inner_circle
      - STORAGE_SECRET_KEY=inner_circle
    volumes:
      - .:/app
      # Mask the host virtualenv directory (Windows .venv) so container operations
      # won't try to remove or modify host files (prevents I/O error / access denied).
      - backend_venv:/app/.venv

  frontend:
    build:
      context: ./frontend
      target: dev
      provenance: false
    container_name: inner_circle_frontend
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_venv:
  seaweedfs_data: